name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Security/tooling runs on an exact patched toolchain. The module's
          # supported language floor remains go 1.22 and is verified below.
          go-version: '1.26.1'
          check-latest: false

      - name: go fmt (verify)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-1-22-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          check-latest: false

      - name: Go 1.22 clean-archive compatibility
        run: |
          archive_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$archive_dir"
          go vet ./...
          go test -race -count=1 ./...
